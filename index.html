<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Gift Exchange</title>
<style>
:root{--bg:#f8f1e4;--card:#fffdf8;--ink:#1b2a21;--muted:#4a5a50;--line:#e3d5bf;--accent:#176b3a;--on-accent:#fff;--berry:#b5202e;--soft:#e4f1e7;--warn-bg:#fbefd2;--warn:#6b4a05;--err:#b5202e;--err-bg:#fbe5e7;--stripe:#fffdf8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a14;--card:#17241c;--ink:#f3efe6;--muted:#b4c0b7;--line:#2f4237;--accent:#5cc488;--on-accent:#07140c;--berry:#ff7b86;--soft:#1e3328;--warn-bg:#3a2c0f;--warn:#f4cf7a;--err:#ff9aa5;--err-bg:#3d1b22;--stripe:#f3efe6}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body::before{content:'';display:block;height:6px;background:repeating-linear-gradient(135deg,var(--berry) 0 14px,var(--stripe) 14px 20px,var(--accent) 20px 34px,var(--stripe) 34px 40px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 80px}
h1,h2,.big{font-family:Georgia,"Times New Roman",serif;font-weight:600}
h1{font-size:30px;line-height:1.2;margin:8px 0 6px}h2{font-size:21px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px}
.help{color:var(--muted);font-size:16px;margin:0 0 14px}
.step{display:block;font-size:14px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.field{display:block;margin:0 0 12px}.field>span{display:block;font-size:15px;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=tel],input[type=url],select,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input,.row>select{flex:1;min-width:0}
button,.btn{font:inherit;font-size:17px;min-height:48px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button:hover,.btn:hover{border-color:var(--muted)}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;width:100%;min-height:60px;font-size:20px}
.wide{width:100%}
.icon{min-height:40px;padding:4px 12px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;min-height:44px;padding:4px}
.list{margin:0 0 6px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:16px}.small{font-size:15px}
.chip{font-size:14px;border-radius:99px;padding:3px 10px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.new{background:var(--berry);color:#fff}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:16px;margin:0 0 16px}
.err{background:var(--err-bg);color:var(--err);border-radius:12px;padding:12px 14px;font-size:16px;margin:12px 0 0}
.good{background:var(--soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-size:17px;margin:12px 0 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.center{text-align:center}
.big{font-size:42px;margin:4px 0;color:var(--berry)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:700;text-align:center;letter-spacing:1px;background:var(--bg);border-radius:12px;padding:14px;margin:0 0 14px;word-break:break-word}
.reveal{border:2px dashed var(--berry);border-radius:18px;padding:40px 12px;text-align:center;cursor:pointer;background:var(--card);width:100%;display:block}
.gift{font-size:48px;line-height:1}
.quote{white-space:pre-wrap;word-break:break-word;font-size:16px;background:var(--bg);border-radius:12px;padding:12px;margin:0 0 14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.names button{min-height:58px;font-size:19px}
.code-in{font-size:22px!important;text-align:center;text-transform:uppercase;letter-spacing:1px}
.todo{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--muted)}
.tick.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.todo .grow{flex:1}.todo p{margin:0 0 8px}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
details summary{cursor:pointer;font-size:17px;font-weight:600;list-style-position:outside}
details>div{padding-top:10px}
.wl li{margin:0 0 6px}.wl ul{padding-left:22px;margin:6px 0}
.kv{font-size:16px;margin:4px 0}.kv b{font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.foot{margin-top:24px;text-align:center}
.blur{filter:blur(7px);user-select:none}
a{color:var(--accent)}
h1,h2,.big,.quote,button,.btn,.names button,.item,.item>span,.kv,.todo p,.sub,.help,.muted,.warn,.good,.err,summary{overflow-wrap:anywhere;min-width:0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ================= helpers ================= */
const te=new TextEncoder(),td=new TextDecoder(),S=crypto.subtle;
const b64u={enc(b){const a=b instanceof Uint8Array?b:new Uint8Array(b);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
dec(s){s=s.replace(/[^A-Za-z0-9_-][\s\S]*$/,'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}};
const pack=o=>b64u.enc(te.encode(JSON.stringify(o))),unpack=s=>JSON.parse(td.decode(b64u.dec(s)));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
function randInt(n){const lim=Math.floor(0x100000000/n)*n;const u=new Uint32Array(1);do crypto.getRandomValues(u);while(u[0]>=lim);return u[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const baseURL=()=>location.origin+location.pathname;
function h(tag,props,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='value')el.value=v;else el.setAttribute(k,v===true?'':v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)))}return el}
const app=document.getElementById('app');
/* links carry their data after ? (Messages link previews drop anything after #); older # links still work */
const currentFrag=()=>location.search.slice(1)||location.hash.slice(1);
function clear(){app.replaceChildren();clearTimeout(toastT);document.getElementById('toast')?.classList.remove('show');window.scrollTo(0,0);lastView='';return app}
const card=(title,help,...kids)=>h('section',{class:'card'},title?h('h2',{},title):null,help?h('p',{class:'help'},help):null,...kids);
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
async function copy(text,label){try{await navigator.clipboard.writeText(text)}catch(e){const ta=h('textarea',{},text);document.body.append(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}toast(label||'Copied')}
/* returns 'shared', 'copied' or 'cancelled' */
async function share(text){if(navigator.share){try{await navigator.share({text});return'shared'}catch(e){if(e&&e.name==='AbortError')return'cancelled'}}await copy(text,'Copied');return'copied'}
const smsHref=(phone,text)=>'sms:'+(phone||'').replace(/[^\d+]/g,'')+'?&body='+encodeURIComponent(text);
function downloadText(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=h('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function pickFile(cb){const i=h('input',{type:'file',accept:'.txt,.json,text/plain,application/json',style:'display:none'});i.addEventListener('change',async()=>{const f=i.files[0];i.remove();if(f)cb(await f.text())});document.body.append(i);i.click()}
const safeURL=u=>{try{const x=new URL(u);return(x.protocol==='https:'||x.protocol==='http:')?x.href:null}catch(e){return null}};
const slug=s=>(s||'gift-exchange').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'gift-exchange';
const fmtTs=ts=>new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const isLocal=()=>location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
/* small on-page "are you sure?" (pop-up dialogs are blocked in some browsers) */
function askInline(slot,question,yesLabel,onYes){slot.replaceChildren(h('div',{class:'warn'},h('p',{style:'margin:0 0 12px'},question),h('div',{class:'row'},h('button',{style:'flex:1',onclick:onYes},yesLabel),h('button',{style:'flex:1',onclick:()=>slot.replaceChildren()},'Cancel'))))}

/* ================= crypto ================= */
const aesRaw=raw=>S.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function seal(key,obj,aad){const iv=rnd(12);const ct=await S.encrypt({name:'AES-GCM',iv,additionalData:te.encode(aad)},key,te.encode(JSON.stringify(obj)));return[b64u.enc(iv),b64u.enc(ct)]}
async function unseal(key,iv,ct,aad){const pt=await S.decrypt({name:'AES-GCM',iv:b64u.dec(iv),additionalData:te.encode(aad)},key,b64u.dec(ct));return JSON.parse(td.decode(pt))}
async function genSigner(){const kp=await S.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const j=await S.exportKey('jwk',kp.privateKey);return{d:j.d,pub:b64u.enc(await S.exportKey('raw',kp.publicKey))}}
function jwkFrom(d,pub){const r=b64u.dec(pub);return{kty:'EC',crv:'P-256',d,x:b64u.enc(r.slice(1,33)),y:b64u.enc(r.slice(33,65))}}
async function signWith(d,pub,data){const k=await S.importKey('jwk',jwkFrom(d,pub),{name:'ECDSA',namedCurve:'P-256'},false,['sign']);return b64u.enc(await S.sign({name:'ECDSA',hash:'SHA-256'},k,te.encode(data)))}
async function verifyWith(pub,sig,data){const k=await S.importKey('raw',b64u.dec(pub),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return S.verify({name:'ECDSA',hash:'SHA-256'},k,b64u.dec(sig),te.encode(data))}
/* ================= the draw: one circle, rules respected ================= */
function drawLoop(ids,banned){
  const n=ids.length;if(n<3)return null;
  const start=shuffle(ids.slice())[0],used=new Set([start]),path=[start];let steps=0;
  function dfs(){if(++steps>500000)return false;const cur=path[path.length-1];
    if(path.length===n)return !banned.has(cur+'>'+start);
    for(const nx of shuffle(ids.filter(x=>!used.has(x)))){if(banned.has(cur+'>'+nx))continue;used.add(nx);path.push(nx);if(dfs())return true;path.pop();used.delete(nx)}
    return false}
  if(!dfs())return null;
  const pairs={};for(let i=0;i<n;i++)pairs[path[i]]=path[(i+1)%n];return pairs}

/* ================= organizer state ================= */
const newOrg=()=>({v:4,sid:b64u.enc(rnd(6)),setupHash:'',ex:{name:'',budget:'',date:''},orgName:'',helper:'',helperPhone:'',people:[],apart:[],lastYear:[],draw:null});
let org=LS.get('gx3.org',null);if(!org||org.v!==4)org=newOrg();
const saveOrg=()=>LS.set('gx3.org',org);
const pname=(id,list)=>((list||org.people).find(p=>p.id===id)||{}).name||'?';
const exName=()=>(org.ex.name||'').trim()||'Gift exchange';
const helperName=()=>org.helper||'whoever set this up';

/* ---------- setup link (helper → organizer) ---------- */
function setupPayload(){const idx=id=>org.people.findIndex(p=>p.id===id);
  return{v:3,k:'setup',sid:org.sid,ex:org.ex,o:org.orgName,hp:org.helper,hph:org.helperPhone,p:org.people.map(p=>[p.name,p.phone||'']),a:org.apart.map(([a,b])=>[idx(a),idx(b)]),l:org.lastYear.map(([a,b])=>[idx(a),idx(b)])}}
const setupLink=()=>baseURL()+'?s='+pack(setupPayload());
function applySetup(s){if(org.draw)LS.set('gx3.org.prev',org);const people=s.p.map(([name,phone])=>({id:b64u.enc(rnd(6)),name,phone}));
  org={...newOrg(),fromLink:true,sid:s.sid,setupHash:JSON.stringify(s),ex:s.ex||{name:'',budget:'',date:''},orgName:s.o||'',helper:s.hp||'',helperPhone:s.hph||'',people,
    apart:(s.a||[]).map(([i,j])=>[people[i]?.id,people[j]?.id]).filter(x=>x[0]&&x[1]),lastYear:(s.l||[]).map(([i,j])=>[people[i]?.id,people[j]?.id]).filter(x=>x[0]&&x[1])};saveOrg()}

/* ---------- backup link (organizer's safety copy) ---------- */
function backupLink(){const d=org.draw,P=d.people,same=JSON.stringify(org.people)===JSON.stringify(P);
  return baseURL()+'?o='+pack({v:4,k:'backup',sid:org.sid,ex:org.ex,o:org.orgName,hp:org.helper,hph:org.helperPhone,people:same?undefined:org.people,apart:org.apart,lastYear:org.lastYear,
    d:{id:d.id,created:d.created,people:P,pairs:d.pairs,r:P.map(p=>d.read[p.id]),k:P.map(p=>d.sk[p.id]),u:P.map(p=>d.pub[p.id]),s:P.reduce((a,p,i)=>d.sentLink[p.id]?[...a,i]:a,[])}})}
function expandBackup(b){const d=b.d;if(!d||!Array.isArray(d.r))return b;
  const P=d.people,read={},sk={},pub={},sentLink={};P.forEach((p,i)=>{read[p.id]=d.r[i];sk[p.id]=d.k[i];pub[p.id]=d.u[i]});(d.s||[]).forEach(i=>{if(P[i])sentLink[P[i].id]=true});
  return{...b,people:b.people||P,d:{...d,read,sk,pub,sentLink}}}
function restoreBackup(b0){const b=expandBackup(b0);
  org={...newOrg(),sid:b.sid,setupHash:b.setupHash||'',ex:b.ex,orgName:b.o||'',helper:b.hp||'',helperPhone:b.hph||'',people:b.people,apart:b.apart||[],lastYear:b.lastYear||[],
    draw:{id:b.d.id,created:b.d.created,people:b.d.people,pairs:b.d.pairs,read:b.d.read,sk:b.d.sk,pub:b.d.pub,wl:{},sentLink:b.d.sentLink||{},backedUp:true}};
  if(!org.setupHash)org.setupHash=JSON.stringify(setupPayload());
  saveOrg();
}

/* ================= HELPER: set it up ================= */
let lastView='';
function vSetup(errMsg,note){
  const keepY=lastView==='setup'?window.scrollY:0;
  clear();lastView='setup';
  requestAnimationFrame(()=>window.scrollTo(0,errMsg?document.body.scrollHeight:keepY));
  app.append(h('div',{class:'warn'},'Got a message from the organizer? Tap the link in that message instead. This page is for setting up a new exchange.'),h('h1',{},'Set up a gift exchange'),h('p',{class:'sub'},"Fill this in, then send it to whoever is running the draw. All they have to do is check the names and tap one button."));
  const f=(label,obj,key,ph,type)=>h('label',{class:'field'},h('span',{},label),h('input',{type:type||'text',value:obj[key]||'',placeholder:ph,maxlength:'60',oninput:e=>{const v=e.target.value.replace(/\s+/g,' ').replace(/^ /,'');if(v!==e.target.value)e.target.value=v;obj[key]=v.trim();saveOrg()}}));
  app.append(card('The exchange',null,f('Name',org.ex,'name','Christmas 2026'),h('div',{class:'row2'},f('Spending limit',org.ex,'budget','$30'),f('Gift day',org.ex,'date','Dec 25'))));
  app.append(card('Who is running it',"The organizer draws the names and sends everyone their own link on Telegram. You're the helper they can ask if they get stuck. If the organizer is taking part, add them to the list below too.",
    f("Organizer's name",org,'orgName','Dad'),(()=>{const o=(org.orgName||'').replace(/\s+/g,' ').trim().toLowerCase();return o&&org.people.length&&!org.people.some(p=>p.name.replace(/\s+/g,' ').trim().toLowerCase()===o)?h('p',{class:'muted small'},`${org.orgName.trim()} isn't on the list below. If they're taking part, add them with exactly this spelling.`):null})(),h('div',{class:'row2'},f('Your name',org,'helper','Richard'),f('Your phone (optional)',org,'helperPhone','+1 555 123 4567','tel'))));

  const nameIn=h('input',{type:'text',placeholder:'Name',maxlength:'40',id:'name-in',onkeydown:e=>{if(e.key==='Enter')add()}});
  const phoneIn=h('input',{type:'tel',placeholder:'+1 555 123 4567',maxlength:'25',onkeydown:e=>{if(e.key==='Enter')add()}});
  const needsPlus=ph=>!!ph&&!ph.trim().startsWith('+');
  const plusNote=h('p',{class:'muted small',style:'margin:6px 0 0'},'Phone numbers need the country code, like +1 555 010 0004. Without it the organizer\'s Telegram button may open the wrong chat.');plusNote.hidden=!org.people.some(x=>needsPlus(x.phone));
  function add(){const n=nameIn.value.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim();if(!n)return;if(org.people.some(p=>p.name.toLowerCase()===n.toLowerCase())){toast(`${n} is already on the list`);return}org.people.push({id:b64u.enc(rnd(6)),name:n,phone:phoneIn.value.trim()});saveOrg();vSetup();setTimeout(()=>document.getElementById('name-in')?.focus(),0)}
  app.append(card(`Who's in (${org.people.length})`,"Phone numbers are optional, but add the country code, like +1 555 123 4567. With one, the organizer's Telegram button opens your chat with that person.",
    h('div',{class:'list'},org.people.length?org.people.map(p=>h('div',{class:'item'},h('span',{style:'flex:1'},p.name),(()=>{const hint=h('div',{class:'muted small'},needsPlus(p.phone)?'country code? e.g. +1':'');return h('div',{style:'width:150px;flex:none'},h('input',{type:'tel',value:p.phone||'',placeholder:'+1 555 123 4567',style:'width:100%','aria-label':p.name+' phone',oninput:e=>{p.phone=e.target.value.trim();saveOrg();hint.textContent=needsPlus(p.phone)?'country code? e.g. +1':'';plusNote.hidden=!org.people.some(x=>needsPlus(x.phone))}}),hint)})(),h('button',{class:'icon','aria-label':'Remove '+p.name,onclick:()=>{org.people=org.people.filter(x=>x.id!==p.id);org.apart=org.apart.filter(([a,b])=>a!==p.id&&b!==p.id);org.lastYear=org.lastYear.filter(([a,b])=>a!==p.id&&b!==p.id);saveOrg();vSetup()}},'✕'))):h('p',{class:'muted'},'No one yet.')),
    plusNote,h('div',{class:'row2',style:'margin-top:8px'},nameIn,phoneIn),h('button',{class:'wide',style:'margin-top:8px',onclick:add},'Add person')));

  const choose=label=>h('select',{'aria-label':label},h('option',{value:''},'Choose…'),org.people.map(p=>h('option',{value:p.id},p.name)));
  const s1=choose('First person'),s2=choose('Second person'),apartErr=h('div');
  const isApart=(a,b)=>org.apart.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
  function addApart(){apartErr.replaceChildren();const a=s1.value,b=s2.value;
    if(!a||!b){apartErr.append(h('div',{class:'err'},'Choose two people first.'));return}
    if(a===b){apartErr.append(h('div',{class:'err'},'Choose two different people.'));return}
    if(isApart(a,b)){apartErr.append(h('div',{class:'err'},`${pname(a)} and ${pname(b)} are already kept apart.`));return}
    org.apart.push([a,b]);saveOrg();vSetup(null,`Added: ${pname(a)} and ${pname(b)} won't get each other. Pick the next pair if there is one.`)}
  app.append(card('Keep people apart',"Pick two people who shouldn't get each other, like a married couple. Add one pair at a time, as many as you like.",

  const long=msg.length>3900,canText=digits.length>=7;
  const area=h('div');

  const askDone=(note,tgUsed)=>area.replaceChildren(...[note?h('div',{class:'good',style:'margin:0 0 12px'},note):null,
    card('Did the backup go through?',tgUsed?"If Telegram didn't open, tap No and use Text or Copy instead.":null,h('button',{class:'primary',onclick:yes},'Yes, back to my jobs'),
      h('button',{class:'wide',style:'margin-top:10px',onclick:showButtons},'No, try another way'))].filter(Boolean));
  const shareBtn=(primary,label)=>h('button',{class:primary?'primary':'wide',style:primary?'':'margin-top:10px',onclick:async()=>{const r=await share(msg);if(r==='cancelled')return;askDone(r==='copied'?`Copied. Open Telegram, open your chat with ${hn}, press and hold in the message box, tap Paste, then send.`:null)}},label);
  const smsBtn=(primary,label)=>h('a',{class:primary?'btn primary':'btn wide',style:primary?'':'margin-top:10px',href:smsHref(hp,msg),onclick:()=>setTimeout(()=>askDone(),300)},label);
  function showButtons(){area.replaceChildren(...(long&&canText?[
    smsBtn(true,`Text it to ${hn}`),
    h('p',{class:'muted center',style:'margin:10px 0 0'},'This one is long, so it goes by text message rather than Telegram. If that fails, tap Send it another way and choose Mail or Notes.'),
    shareBtn(false,'Send it another way')]:[
    tg?h('a',{class:'btn primary',href:'tg://resolve?phone='+tg+'&text='+encodeURIComponent(msg),onclick:()=>setTimeout(()=>askDone(null,true),300)},`Send it to ${hn} on Telegram`):null,
    tg?smsBtn(false,`Text it to ${hn} instead`):(canText?smsBtn(true,`Text it to ${hn}`):null),
    hp&&(tg||canText)?shareBtn(false,'Send it another way'):shareBtn(true,'Send the backup')]).filter(Boolean))}
  app.append(h('span',{class:'step'},'Job 2 of 2'),h('h1',{},'Save a backup'),
    h('p',{class:'sub'},org.helper?`Keep a copy in case this phone ever loses it. Send it to ${hn} and ${hn} will keep it safe. Don't send it to the family.`:`Keep a copy in case this phone ever loses it. Text or email it to yourself. Don't send it to the family.`),
    area,h('div',{class:'foot'},h('button',{onclick:vHome},'Back')));
  showButtons();
}

function resultsText(){
  const d=org.draw,P=d.people,L=[];
  L.push(`${exName().toUpperCase()}: GIFT EXCHANGE RESULTS`,`Saved ${new Date().toLocaleString()}. Keep this private.`,'');
  if(org.ex.budget||org.ex.date)L.push([org.ex.budget&&`Spending limit: ${org.ex.budget}`,org.ex.date&&`Gift day: ${org.ex.date}`].filter(Boolean).join('   '),'');
  L.push('WHO IS BUYING FOR WHO');P.forEach(p=>L.push(`  ${p.name} is buying for ${pname(d.pairs[p.id],P)}`));L.push('');
  L.push('PERSONAL LINKS (each one is private to that person)');P.forEach(p=>L.push(`  ${p.name}: ${personalLink(d,p)}`));L.push('');
  const w=P.filter(p=>d.wl[p.id]);
  if(w.length){L.push('WISHLISTS');w.forEach(p=>{const x=d.wl[p.id].data;L.push(`  ${p.name}:`);(x.items||[]).forEach(i=>L.push(`    - ${i.t}${i.u?' ('+i.u+')':''}`));if(x.sizes)L.push(`    Sizes: ${x.sizes}`);if(x.favs)L.push(`    Likes: ${x.favs}`);if(x.no)L.push(`    Please no: ${x.no}`)});L.push('')}
  L.push('ORGANIZER BACKUP LINK (private: reopens the organizer page)',`  ${backupLink()}`,'',"Next year: on the setup page, tap \"Load last year's results file\" and pick this file so nobody gets the same person again.");
  return L.join('\n');
}

/* ================= wishlists ================= */
function wlBody(data,seen){
  const items=(data.items||[]).filter(i=>i&&i.t);const isNew=t=>seen&&!seen.includes(t);
  return h('div',{class:'wl'},
    items.length?h('ul',{},items.map(i=>{const u=safeURL(i.u);return h('li',{},i.t,u?[' ',h('a',{href:u,target:'_blank',rel:'noreferrer noopener'},'see it')]:null,isNew(i.t)?[' ',h('span',{class:'chip new'},'new')]:null)})):h('p',{class:'muted'},'No ideas listed.'),
    data.sizes?h('p',{class:'kv'},h('b',{},'Sizes: '),data.sizes):null,
    data.favs?h('p',{class:'kv'},h('b',{},'Likes: '),data.favs):null,
    data.no?h('p',{class:'kv'},h('b',{},'Please no: '),data.no):null);
}

/* ================= FAMILY ================= */
const ME=()=>LS.get('gx3.me',{}),WL=()=>LS.get('gx3.wl',{});
const meKey=I=>I.d+':'+I.me.id;
const ownKey=I=>'own:'+meKey(I);
const revealedNow=new Set();/* reveal lasts for this page load only */
function vPersonalLink(frag){
  let g;try{g=unpack(frag.slice(2))}catch(e){g=null}
  const m=g&&g.me,t=g&&g.to;
  if(!g||g.v!==4||g.k!=='me'||!g.d||!m||!m.id||!m.name||!m.pub||!m.read||!m.sk||!t||!t.id||!t.name||!t.read||!t.pub)return vMsg('This link looks cut off',"Ask the organizer to send it again. Make sure you tap the whole link.");
  const I={d:g.d,ex:g.ex,b:g.b,dt:g.dt,o:g.o,people:[{id:m.id,name:m.name,pub:m.pub},{id:t.id,name:t.name,pub:t.pub}],me:{id:m.id,name:m.name,pub:m.pub,read:m.read,sk:m.sk},to:{id:t.id,name:t.name,read:t.read,pub:t.pub},link:frag};
  const all=ME(),k=meKey(I),old=all[k];
  const store=()=>{I.at=Date.now();all[k]=I;LS.set('gx3.me',all);vReveal(I)};
  const FK=['id','name','pub','read','sk'];
  if(old&&old.to&&old.me&&(old.d!==I.d||FK.some(x=>old.me[x]!==I.me[x]||old.to[x]!==I.to[x]))){
    clear();const slot=h('div');
    app.append(h('h1',{},'You already have a link'),h('p',{class:'sub'},`This phone already has a link for ${I.me.name} in this exchange. Keep the one you have, or use this new one?`),
      h('button',{class:'primary',onclick:()=>{old.at=Date.now();all[k]=old;LS.set('gx3.me',all);vReveal(old)}},'Keep what I have'),
      h('button',{class:'wide',style:'margin-top:10px',onclick:()=>askInline(slot,`Use the new link for ${I.me.name} instead of the one on this phone?`,'Use this new one',store)},'Use this new one'),slot);
    return}
  store();
}

function vReveal(I,arrived){
  clear();
  if(currentFrag())history.replaceState(null,'',baseURL());
  app.append(h('h1',{},`Hi ${I.me.name}`),h('p',{class:'sub'},I.ex));
  const key=meKey(I);
  const nameEl=h('div',{class:'big center'},I.to.name);
  const details=h('div',{},h('p',{class:'center muted',style:'margin:0'},"You're buying a gift for"),nameEl,(I.b||I.dt)?h('p',{class:'center muted',style:'margin:0'},[I.b&&`Spending limit ${I.b}`,I.dt].filter(Boolean).join(' · ')):null);
  const wk=I.d+':'+I.to.id,wlSlot=h('div');
  /* the recipient's name and list are only built once the person has tapped */
  const showWl=()=>{const entry=WL()[wk];
    const c=card(`${I.to.name}'s wishlist`,null,
      entry?[h('p',{class:'muted small'},'Updated '+fmtTs(entry.ts)),wlBody(entry.data,entry.seen)]:h('p',{class:'muted'},`Nothing yet. If ${I.to.name} adds a wishlist, they'll post a link in the family group chat. Tap it on this phone and it will show up here.`));
    wlSlot.replaceChildren(c);
    if(entry){const all=WL();all[wk]={...entry,seen:(entry.data.items||[]).map(i=>i.t)};LS.set('gx3.wl',all)}
    return c};
  const goScroll=c=>{if(arrived)setTimeout(()=>c.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),0)};
  if(arrived){if(!revealedNow.has(key)){toast('A wishlist arrived');app.insertBefore(h('div',{class:'good arrivednote',style:'margin:0 0 16px'},"Their wishlist is here. Tap to see who you got, then scroll down."),app.children[2])}else toast(`${I.to.name}'s wishlist arrived`)}
  if(!revealedNow.has(key)){
    const btn=h('button',{class:'reveal',onclick:()=>{revealedNow.add(key);app.querySelector('.arrivednote')?.remove();btn.replaceWith(details);goScroll(showWl());
      if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ',n=I.to.name;let f=0;const t=setInterval(()=>{f++;nameEl.textContent=f>14?n:Array.from(n,c=>c===' '?' ':A[randInt(26)]).join('');if(f>14)clearInterval(t)},60)}},
      h('div',{class:'gift'},'🎁'),h('div',{style:'font-weight:700;font-size:20px;margin-top:8px'},'Tap to see who you got'),h('div',{class:'muted small'},'Make sure no one is peeking'));
    app.append(card(null,null,btn));
  }else{app.append(card(null,null,details));goScroll(showWl())}
  app.append(wlSlot);
  app.append(card('Your wishlist',"Help whoever drew you. Only they can read it.",h('button',{class:'primary',onclick:()=>vEditor(I)},WL()[ownKey(I)]?'Change my wishlist':'Make my wishlist')));
  if(org.draw)app.append(h('div',{class:'foot'},h('button',{onclick:()=>{history.replaceState(null,'',baseURL());vHome()}},'Back to my jobs')));
}

const shareText=(I,link)=>`🎁 ${I.me.name}'s wishlist is ready! (Only the person who drew ${I.me.name} can open it.)\n${link}`;
function vEditor(I){
  clear();const DK='gx3.draft',all=LS.get(DK,{}),key=meKey(I);
  const data=all[key]||{items:[{t:'',u:''}],sizes:'',favs:'',no:''};
  if(!Array.isArray(data.items)||!data.items.length)data.items=[{t:'',u:''}];
  const persist=()=>{const a=LS.get(DK,{});a[key]=data;LS.set(DK,a)};
  const list=h('div',{});
  function rows(){list.replaceChildren(...data.items.map((it,i)=>h('div',{class:'item',style:'display:block'},
    h('div',{class:'row'},h('input',{type:'text',value:it.t,placeholder:'Gift idea',maxlength:'120',oninput:e=>{it.t=e.target.value;persist()}}),h('button',{class:'icon','aria-label':'Remove idea',onclick:()=>{data.items.splice(i,1);if(!data.items.length)data.items.push({t:'',u:''});persist();rows()}},'✕')),
    h('input',{type:'url',value:it.u,placeholder:'Web link (optional)',maxlength:'300',style:'margin-top:6px',oninput:e=>{it.u=e.target.value;persist()}}))))}
  rows();
  const ta=(k,label,ph)=>h('label',{class:'field'},h('span',{},label),h('textarea',{placeholder:ph,maxlength:'200',oninput:e=>{data[k]=e.target.value;persist()}},data[k]));
  const err=h('div');
  app.append(h('h1',{},'My wishlist'),h('p',{class:'sub'},'Only the person who drew you can read it.'),
    card('Gift ideas',null,list,h('button',{class:'wide',style:'margin-top:8px',onclick:()=>{if(data.items.length>=15){toast('15 ideas is the most you can add.');return}data.items.push({t:'',u:''});persist();rows()}},'+ Add another idea')),
    card('Helpful details',null,ta('sizes','Sizes','Shirt M, shoe 9'),ta('favs','Things you like','Green, coffee, hiking'),ta('no','Please no','Socks, mugs')),err,
    h('button',{class:'primary',onclick:save},'Save my wishlist'),
    h('div',{class:'foot'},h('button',{onclick:()=>vReveal(I)},'Back')));
  async function save(){
    err.replaceChildren();
    const clean={items:data.items.map(i=>({t:(i.t||'').trim().slice(0,120),u:(i.u||'').trim().slice(0,300)})).filter(i=>i.t).slice(0,15),sizes:(data.sizes||'').trim().slice(0,200),favs:(data.favs||'').trim().slice(0,200),no:(data.no||'').trim().slice(0,200)};
    if(!clean.items.length&&!clean.sizes&&!clean.favs&&!clean.no){err.append(h('div',{class:'err',style:'margin-bottom:12px'},'Add at least one idea or detail first.'));return}
    for(const i of clean.items)if(i.u&&!safeURL(i.u)){err.append(h('div',{class:'err',style:'margin-bottom:12px'},`"${i.u}" isn't a full web link. It should start with https:// or http://`));return}
    persist();
    const ts=Date.now(),ts36=ts.toString(36),aad=`w2|${I.d}|${I.me.id}|${ts36}`;
    const[iv,ct]=await seal(await aesRaw(b64u.dec(I.me.read)),clean,aad);
    const sig=await signWith(I.me.sk,I.me.pub,`${aad}|${iv}|${ct}`);
    const link=`${baseURL()}?w=2.${I.d}.${I.me.id}.${ts36}.${iv}.${ct}.${sig}`;
    if(link.length>6000||shareText(I,link).length>3900){const over=Math.ceil(Math.max(shareText(I,link).length-3900,link.length-6000)/1.4);err.append(h('div',{class:'err',style:'margin-bottom:12px'},`Your wishlist is too long to share by about ${over} letters. Web links take the most room, so remove a few of those first.`));return}
    const w=WL();w[ownKey(I)]={ts,data:clean,seen:null};LS.set('gx3.wl',w);
    vShared(I,link);
  }
}

function vShared(I,link){
  clear();const text=shareText(I,link);
  const after=h('div');
  app.append(h('div',{class:'center',style:'margin-top:24px'},h('div',{class:'gift'},'🔒'),h('h1',{},'Saved and locked'),h('p',{class:'sub'},"Last step: post it in the family group chat. Everyone will see the message, but only the person who drew you can open it.")),
    h('button',{class:'primary',onclick:async()=>{const r=await share(text);if(r==='copied')after.replaceChildren(h('div',{class:'good'},'Copied! Open the family group chat, press and hold in the message box, tap Paste, then send.'));else if(r==='shared')after.replaceChildren(h('div',{class:'good'},'Posted. Only the person who drew you can open it.'))}},'Post it to the family'),after,
    h('p',{class:'muted center',style:'margin-top:14px'},'Want to change it later? Change it and post it again. The newest one always wins.'),
    h('div',{class:'foot'},h('button',{onclick:()=>vReveal(I)},'Back to my page')));
}

async function vWishlistLink(frag){
  const p=frag.slice(2).replace(/[^A-Za-z0-9_-]+$/,'').split('.');
  if(p.length!==7||p[0]!=='2')return vMsg("This wishlist can't be opened",'This wishlist link looks cut off or changed. Ask for it to be posted again.');
  const[,d,o,ts36,iv,ct,sig]=p,aad=`w2|${d}|${o}|${ts36}`,ts=parseInt(ts36,36);
  const open=async(read,pub)=>{if(!pub||!await verifyWith(pub,sig,`${aad}|${iv}|${ct}`))throw new Error('sig');return unseal(await aesRaw(b64u.dec(read)),iv,ct,aad)};
  const bad=()=>vMsg("This wishlist can't be opened","This wishlist link looks cut off or changed. Ask for it to be posted again.");
  const mine=Object.values(ME()).filter(I=>I.d===d);
  const giver=mine.find(I=>I.to.id===o);
  if(giver){try{const data=await open(giver.to.read,giver.to.pub);const all=WL(),k=d+':'+o,cur=all[k];
      if(!cur||cur.ts<ts){all[k]={ts,data,seen:cur?cur.seen:[]};LS.set('gx3.wl',all)}const fresh=!cur||cur.ts<ts;
      vReveal(giver,fresh);if(cur&&cur.ts>ts)toast('You already have a newer version of this wishlist');else if(cur&&cur.ts===ts)toast('You already have this wishlist');return}catch(e){return bad()}}
  const owner=mine.find(I=>I.me.id===o);
  if(owner){try{const data=await open(owner.me.read,owner.me.pub);clear();
      app.append(h('h1',{},'This is your wishlist'),h('p',{class:'sub'},'This is what your giver will see.'),card(null,null,wlBody(data,null)),h('button',{class:'primary',onclick:()=>vReveal(owner)},'Go to my page'));return}catch(e){return bad()}}
  if(org.draw&&org.draw.id===d&&org.draw.read[o]){
    try{const data=await open(org.draw.read[o],org.draw.pub[o]);const cur=org.draw.wl[o];if(!cur||cur.ts<ts){org.draw.wl[o]={ts,data};saveOrg()}
      clear();app.append(h('h1',{},`${pname(o,org.draw.people)}'s wishlist`),h('p',{class:'sub'},'Organizer view · updated '+fmtTs(ts)),card(null,null,wlBody(data,null)),h('button',{class:'primary',onclick:()=>{history.replaceState(null,'',baseURL());vHome()}},'Back to my jobs'));return}
    catch(e){return bad()}}
  vMsg('This wishlist is locked',`Only the person who drew them can open it. If that's you, tap the message the organizer sent you first, then tap this link again.`);
}

function vMsg(title,body,...extra){clear();
  const ids=Object.values(ME()).filter(I=>I&&I.me&&I.to).sort((a,b)=>(b.at||0)-(a.at||0));
  const way=org.draw?h('button',{class:'primary',style:'margin-top:16px',onclick:()=>{history.replaceState(null,'',baseURL());vHome()}},'Back to my jobs'):ids.length?h('button',{class:'primary',style:'margin-top:16px',onclick:()=>vReveal(ids[0])},'Back to my page'):null;
  app.append(h('div',{class:'center',style:'margin-top:48px'},h('div',{class:'gift'},'🔒'),h('h1',{},title),h('p',{class:'sub'},body),...extra,way))}

/* ================= links that open the organizer side ================= */
function vSetupLink(frag){
  let s;try{s=unpack(frag.slice(2))}catch(e){s=null}
  if(!s||s.k!=='setup'||!Array.isArray(s.p))return vMsg('This link looks cut off','Ask for it to be sent again. Make sure you tap the whole link.');
  const hash=JSON.stringify(s);
  const goWelcome=()=>{applySetup(s);history.replaceState(null,'',baseURL());vWelcome()};
  if(!org.draw)return goWelcome();
  if(org.sid===s.sid&&org.setupHash===hash){history.replaceState(null,'',baseURL());return vHome()}
  clear();const slot=h('div');
  app.append(h('h1',{},'You already drew names'),h('p',{class:'sub'},`${s.hp||'Someone'} sent a new list. Using it means drawing names again and sending everyone new links.`),
    h('button',{class:'primary',onclick:()=>{history.replaceState(null,'',baseURL());vHome()}},'Keep my current draw'),
    h('button',{class:'wide',style:'margin-top:10px',onclick:()=>askInline(slot,'Use the new list? You can still change your mind before you draw.','Yes, use the new one',goWelcome)},'Use the new list'),slot);
}
async function vBackupLink(frag){
  let b;try{b=unpack(frag.slice(2))}catch(e){b=null}
  if(!b||b.k!=='backup'||!b.d)return vMsg('This backup link looks cut off','Make sure you tap the whole link.');
  const restore=async()=>{restoreBackup(b);history.replaceState(null,'',baseURL());vHome();toast('Organizer page restored')};
  if(org.draw&&org.draw.id===b.d.id){history.replaceState(null,'',baseURL());return vHome()}
  const bName=((b.ex&&b.ex.name)||'').trim()||'Gift exchange';
  clear();const slot=h('div');
  const leave=()=>{history.replaceState(null,'',baseURL());if(org.draw||org.fromLink||org.ready||Object.keys(ME()).length)return route();vMsg('Nothing changed','Tap the backup link again whenever you want to bring the organizer page back.')};
  app.append(h('h1',{},'Restore this backup?'),
    h('p',{class:'sub'},org.draw?`This phone already has a different draw (${exName()}).`:`This brings back the organizer page for ${bName}.`),slot,
    h('div',{class:'foot'},h('button',{onclick:leave},org.draw?'Keep what I have':'Not now')));
  askInline(slot,org.draw?`Replace the draw made ${fmtTs(org.draw.created)} on this phone with the backup from ${fmtTs(b.d.created)}?`:`Restore the organizer page for ${bName}?`,'Yes, restore',restore);
}

function route(){
  const f=currentFrag();
  if(f.startsWith('g='))return vMsg('This link is from an older version of the page','Ask the organizer to send you your own link.');
  if(f.startsWith('m='))return vPersonalLink(f);
  if(f.startsWith('w='))return vWishlistLink(f);
  if(f.startsWith('s='))return vSetupLink(f);
  if(f.startsWith('o='))return vBackupLink(f);
  if(org.draw)return vHome();
  if((org.fromLink||org.ready)&&org.people.length)return vWelcome();
  const ids=Object.values(ME()).filter(I=>I&&I.me&&I.to).sort((a,b)=>(b.at||0)-(a.at||0));
  if(ids.length)return vReveal(ids[0]);
  return vSetup();
}
addEventListener('hashchange',route);
if(!window.crypto||!crypto.subtle)vMsg('This browser is missing a security feature','Open the link in Safari or Chrome.');else route();
</script>
